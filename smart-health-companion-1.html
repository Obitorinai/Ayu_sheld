<div class="card dk" style="margin-bottom:14px"><div class="mu">Current risk</div><div class="big">${SEV[o][0]} ${SEV[o][1].toUpperCase()}</div><p style="margin:6px 0 0">${r.t==='none'?'No immediate warning detected.':r.ai}</p></div>
<div class="grid g2 g3d">${r.ind.map(i=>`<div class="card"><div class="mu">${i[0]} ${i[1]}</div><div class="sev s-${i[2]==='na'?'na':i[2]}">${i[2]==='na'?'⚪':SEV[i[2]][0]} ${i[3]}</div></div>`).join('')}</div>
<h3 style="margin:20px 0 8px">Alert history</h3><div class="card">${alerts().map(a=>`<button class="tg" style="width:100%;background:none;border:0;border-bottom:1px solid var(--bd);text-align:left" onclick="alertD('${a.k}')"><span>${SEV[a.sev][0]} <b>${a.title}</b><br><span class="mu">${a.time}</span></span><span class="sev">${a.status}</span></button>`).join('')}</div>`}
function pProf(){const p=S.prof;const f=(k,l,t='text')=>`<label for="f_${k}">${l}</label><input id="f_${k}" type="${t}" value="${esc(p[k])}"><div class="er" id="e_${k}"></div>`;
const sel=(k,l,o)=>`<label for="f_${k}">${l}</label><select id="f_${k}">${o.map(v=>`<option ${v===p[k]?'selected':''}>${v}</option>`).join('')}</select>`;
return`<div class="top"><div><h2>👤 My profile</h2><div class="mu">Changes appear on your dashboard when you save</div></div><button class="ib" onclick="go('set')" aria-label="Settings and privacy">⚙️</button></div>
<div class="grid two"><div class="card"><h3>Personal</h3>${f('name','Name')}${f('age','Age','number')}${sel('sex','Sex',['Female','Male','Other','Prefer not to say'])}${f('city','Area / city')}${sel('work','Work type',['Indoor','Outdoor','Mixed'])}<h3 style="margin-top:14px">Body & lifestyle</h3>${f('height','Height (cm)','number')}${f('weight','Weight (kg)','number')}${sel('act','Activity level',['Low','Moderate','High'])}${sel('sleepH','Usual sleep (hours)',['6','7','7.5','8','9'])}<h3 style="margin-top:14px">Emergency</h3>${f('ec','Emergency contact')}${f('ep','Contact phone','tel')}<div class="row" style="margin-top:12px"><button class="btn" onclick="saveP()">Save changes</button><button class="btn sec" onclick="render()">Cancel</button></div></div>
<div class="card" style="align-self:start"><h3>Connected devices</h3><div class="tg"><span>📱 Phone</span><span class="mu">Demo data</span></div><div class="tg"><span>⌚ Wearable</span><span class="mu">${S.wear?'Demo data':'Not connected'}</span></div></div></div>`}
function vld(g,keys){const er={};if(keys.includes('name')&&(!g('name')||g('name').length>40))er.name='Enter a name (up to 40 characters).';if(keys.includes('age')){const a=+g('age');if(!(a>=13&&a<=110))er.age='Enter an age between 13 and 110.'}
if(keys.includes('city')&&!g('city'))er.city='Enter your area or city.';if(keys.includes('height')&&!(+g('height')>=100&&+g('height')<=230))er.height='Enter a height between 100 and 230 cm.';if(keys.includes('weight')&&!(+g('weight')>=25&&+g('weight')<=250))er.weight='Enter a weight between 25 and 250 kg.';
if(keys.includes('ep')&&g('ep')&&!/^[+\d][\d\s()-]{6,}$/.test(g('ep')))er.ep='Enter a valid phone number.';return er}
function showEr(er){document.querySelectorAll('.er').forEach(n=>n.textContent='');const ks=Object.keys(er);ks.forEach(k=>{const n=$('#e_'+k);n&&(n.textContent=er[k])});if(ks.length){const i=document.querySelector('[id$="_'+ks[0]+'"]');i&&i.focus()}return ks.length}
function saveP(){const g=k=>$('#f_'+k).value.trim();if(showEr(vld(g,['name','age','city','height','weight','ep'])))return;
['name','age','sex','city','work','height','weight','act','sleepH','ec','ep'].forEach(k=>S.prof[k]=g(k));applyProf();toast('Profile updated successfully.');render()}
/* ---------- onboarding ---------- */
function oi(k,v,r){S.prof[k]=v;applyProf();if(r)render();else{const n=$('#pv');n&&(n.innerHTML=pv())}}
function pv(){const p=S.prof,b=bmi();return`<div class="card"><div class="mu">Live dashboard preview</div><div class="row" style="margin:10px 0;flex-wrap:nowrap"><div class="av">${esc((p.name||'?')[0].toUpperCase())}</div><div><h3 style="margin:0">Good morning, ${esc(p.name||'there')} 👋</h3><div class="mu">${p.age?esc(p.age)+' yrs':'Age'} · ${esc(p.sex||'Sex')} · ${esc(p.city||'Location')}</div></div></div><div class="row"><span class="chip">📏 ${esc(p.height||'—')} cm</span><span class="chip">⚖️ ${esc(p.weight||'—')} kg</span><span class="chip">BMI ${b?b.toFixed(1):'—'}</span><span class="chip">😴 ${p.sleepH} h</span><span class="chip">🏃 ${p.act}</span><span class="chip">💼 ${p.work}</span></div>${b?`<p class="mu" style="margin:10px 0 0">BMI is ${bmiC(b)}. It is a rough guide, not a health assessment.</p>`:''}<div class="mu" style="margin-top:10px">Nearby care will be shown around ${esc(p.city||'your area')} (demo).</div></div>`}
function pOnb(){const p=S.prof,s=S.onb;
const T=[['Let’s start with you','Tell us a little so your dashboard feels personal.'],['Where you are','Used for local weather, air quality and nearby care.'],['Body and lifestyle','Used to tailor goals and compare you with your own baseline.'],['Safety and privacy','Optional. You can change any of this later.']];
const fi=(k,l,t='text',ph='')=>`<label for="o_${k}">${l}</label><input id="o_${k}" type="${t}" value="${esc(p[k])}" placeholder="${ph}" oninput="oi('${k}',this.value)"><div class="er" id="e_${k}"></div>`;
const seg=(k,o,suf='')=>`<div class="seg" role="radiogroup">${o.map(v=>`<button class="btn ${p[k]===v?'':'sec'}" role="radio" aria-checked="${p[k]===v}" onclick="oi('${k}','${v}',1)">${v}${suf}</button>`).join('')}</div><div class="er" id="e_${k}"></div>`;
const tg=(k,l,d)=>`<div class="tg"><div><b>${l}</b><div class="mu">${d}</div></div><button class="sw" role="switch" aria-checked="${!!S.set[k]}" aria-label="${l}" onclick="S.set.${k}=+!S.set.${k};render()"></button></div>`;
const B4=[`${fi('name','Your name','text','e.g. Alex')}${fi('age','Age','number','e.g. 34')}<label>Sex</label>${seg('sex',['Female','Male','Other','Prefer not to say'])}`,
`${fi('city','Area / city','text','e.g. Riverside')}<label>Work type</label>${seg('work',['Indoor','Outdoor','Mixed'])}`,
`${fi('height','Height (cm)','number','e.g. 170')}${fi('weight','Weight (kg)','number','e.g. 65')}<label>Activity level</label>${seg('act',['Low','Moderate','High'])}<label>Usual sleep</label>${seg('sleepH',['6','7','7.5','8','9'],' h')}`,
`${fi('ec','Emergency contact (optional)','text','Name')}${fi('ep','Contact phone (optional)','tel','+1 555 0100')}${tg('loc','Location','For local weather and nearby care.')}${tg('notif','Notifications','For risk alerts.')}`];
return`<div class="ob"><div style="position:relative"><svg viewBox="0 0 200 200" width="120" aria-hidden="true" style="position:absolute;right:0;top:-10px;opacity:.9"><path d="M100 20C130 20 170 50 170 100C170 150 130 180 100 180C60 180 30 150 30 100C30 50 70 20 100 20Z" fill="#ffd9ea"/><path d="M100 50C120 50 145 70 145 100C145 130 120 150 100 150C80 150 55 130 55 100C55 70 80 50 100 50Z" fill="#d6e4ff"/></svg>
<span class="pill">🩺 Smart Health Companion</span><h2 style="font-size:32px;margin:14px 0 4px">${T[s][0]}</h2><p class="mu" style="margin:0">${T[s][1]}</p><div class="prog" aria-label="Step ${s+1} of 4">${[0,1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
<div class="card">${B4[s]}<div class="row sp" style="margin-top:16px">${s>0?'<button class="btn sec" onclick="S.onb--;render()">Back</button>':'<span></span>'}<button class="btn" onclick="nextOnb()">${s<3?'Continue':'Open my dashboard'}</button></div></div></div>
<div id="pv">${pv()}</div></div>`}
function nextOnb(){const s=S.onb,g=k=>$('#o_'+k)?$('#o_'+k).value.trim():S.prof[k];const K=[['name','age'],['city'],['height','weight'],['ep']],er=vld(g,K[s]);if(s===0&&!S.prof.sex)er.sex='Choose an option.';if(showEr(er))return;
if(s<3){S.onb++;render();scrollTo(0,0)}else{S.prof.done=true;S.page='dash';render();scrollTo(0,0);toast('Welcome, '+S.prof.name+'. Your dashboard is ready.')}}
function pSet(){const T=[['health','Health data','Used to display health measurements and generate personalized insights.'],['loc','Location','Used to provide local weather, environmental information and nearby healthcare facilities.'],['notif','Notifications','Used to send risk alerts.'],['ai','AI processing','Lets the AI layer explain structured risk results. It never receives raw personal details.'],['hist','Location history','Keeps past locations. Off by default.']];
return`<div class="top"><div><h2>⚙️ Settings & privacy</h2></div><button class="btn sec" onclick="go('prof')">← Profile</button></div>
<div class="grid two"><div class="card"><h3>🔐 Privacy center</h3><p>Your health data belongs to you.</p>${T.map(t=>`<div class="tg"><div><b>${t[1]}</b><div class="mu">${t[2]}</div></div><button class="sw" role="switch" aria-checked="${!!S.set[t[0]]}" aria-label="${t[1]}" onclick="S.set.${t[0]}=+!S.set.${t[0]};render()"></button></div>`).join('')}<p class="mu">This prototype stores nothing on a server and does not claim encryption.</p></div>
<div class="grid" style="align-content:start"><div class="card"><h3>Account</h3><div class="tg"><span>Profile</span><button class="btn gh" onclick="go('prof')">Edit</button></div><div class="tg"><span>Authentication</span><span class="mu">Not enabled in demo</span></div></div>
<div class="card"><h3>Appearance</h3><div class="row"><button class="btn sec" onclick="document.documentElement.dataset.theme='light'">Light</button><button class="btn sec" onclick="document.documentElement.dataset.theme='dark'">Dark</button></div></div>
<div class="card"><h3>About</h3><p class="mu">Smart Health Companion is a wellness prototype. It shows possible risk indicators from simulated data and is not a medical device or diagnosis.</p><button class="btn dg" onclick="sheet('<h2>Delete account?</h2><p>Demo only: nothing is stored, so nothing is deleted.</p><button class=&quot;btn&quot; onclick=&quot;closeS()&quot;>Got it</button>')">Delete account</button></div></div></div>`}

/* ---------- demo control + simulation ---------- */
function demoOpen(){sheet(`<div class="row sp"><h2>🎛 Demo control</h2>${x}</div><p class="mu">Current mode: <b>Demo data</b> · ${SC[S.sc].n}</p>${Object.keys(SC).map(k=>`<label class="tg" style="cursor:pointer"><span>${SC[k].i} ${SC[k].n}</span><input type="radio" name="sc" value="${k}" style="width:auto" ${k===S.sc?'checked':''}></label>`).join('')}
<div class="row" style="margin-top:14px"><button class="btn" onclick="runSc(document.querySelector('input[name=sc]:checked').value)">Run scenario</button><button class="btn sec" onclick="runSim()">Run timeline simulation</button></div>`)}
function runSc(id){clearTimeout(S.tm);S.sim=null;load(id);S.dis={};S.fdis={};S.faK=null;S.busy=true;closeS();go('dash');setTimeout(()=>{S.busy=false;render()},700)}
function runSim(){clearTimeout(S.tm);load('normal');S.dis={};S.fdis={};S.faK=null;closeS();S.page='dash';const h=()=>S.cur.h,e=()=>S.cur.e;
const st=[['Normal day',0,()=>{}],['Activity increases',0,()=>{h().act='High';h().st=8600}],['Environmental temperature rises',0,()=>{Object.assign(e(),{t:36,fl:41,hu:78,uv:'High',wx:'Hot and humid',ex:3.5})}],['Heart rate changes',1,()=>{Object.assign(h(),{hr:112,rhr:78,t:37.6,spo2:96,st:9800})}],['Hydration decreases',1,()=>{h().hy=900}],['Risk engine detects a pattern',2,()=>{}],['Alert generated',4,()=>{S.sc='heat'}],['AI explains and shows a precaution',3,()=>{S.busy=true;setTimeout(()=>{S.busy=false;render()},800)}]];
let i=0;(function n(){st[i][2]();S.sim={l:st[i][0],p:st[i][1],i};render();scrollTo(0,0);if(++i<st.length)S.tm=setTimeout(n,2200);else S.tm=setTimeout(()=>{S.sim=null;render()},3500)})()}

function faRender(){const r=risk(),k=r.t+S.sc,el=$('#fa');const show=S.prof.done&&r.t!=='none'&&!S.fdis[k]&&(!S.sim||S.sim.i>=6);if(!show){el.innerHTML='';S.faK=null;return}if(S.faK===k)return;S.faK=k;
const n=nearest(1,'hospital')[0],h=S.cur.h;el.innerHTML=`<div class="card fa" role="alert"><div class="row sp" style="flex-wrap:nowrap"><b>⚠️ ${r.title} · ${SEV[r.sev][1]}</b><button class="btn gh" onclick="fdis()" aria-label="Dismiss alert">✕</button></div><div class="mu" style="margin:4px 0">Health condition: ❤️ ${Math.round(h.hr)} BPM · 🌡 ${h.t}°C · 🫁 ${h.spo2}% · ${r.f.slice(0,2).join(', ')||'signals changed'}</div><div>🏥 Nearest hospital: <b>${esc(n.n)}</b> · ${n.d} km <span class="mu">(demo)</span></div><div class="row" style="margin-top:10px"><button class="btn" onclick="toast('Demo only: connect a map provider for directions')">Directions</button><button class="btn sec" onclick="S.sel='${n.n.replace(/'/g,"\\'")}';fdis();go('env')">View on map</button><button class="btn sec" onclick="fdis();why()">Why?</button></div><div class="mu" style="margin-top:6px">A possible-risk indicator, not a diagnosis.</div></div>`}
function fdis(){S.fdis[risk().t+S.sc]=1;S.faK=null;$('#fa').innerHTML=''}
function render(){const p=S.page,ob=!S.prof.done;document.body.classList.toggle('onb',ob);if(ob){$('#main').innerHTML=pOnb();$('#fa').innerHTML='';S.faK=null;return}
$('#side').innerHTML=`<h1>SMART HEALTH<br>COMPANION</h1>`+NAV.map(n=>`<button class="nb ${p===n[0]?'on':''}" onclick="go('${n[0]}')" ${p===n[0]?'aria-current="page"':''}>${n[1]} ${n[2]}</button>`).join('')+`<div style="flex:1"></div><button class="nb ${p==='set'?'on':''}" onclick="go('set')">⚙️ Settings</button>`;
$('#bt').innerHTML=NAV.map(n=>`<button class="${p===n[0]||(p==='set'&&n[0]==='prof')?'on':''}" onclick="go('${n[0]}')" ${p===n[0]?'aria-current="page"':''}><span style="font-size:20px">${n[1]}</span>${n[3]}</button>`).join('');
$('#main').innerHTML=({dash:pDash,env:pEnv,risk:pRisk,prof:pProf,set:pSet})[p]();faRender()}
render();
</script></body></html>
